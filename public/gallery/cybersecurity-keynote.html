g-3 {\n      top: 50%;\n      right: -8%;\n      animation: float 7s ease-in-out infinite 0.6s;\n    }\n\n    .node {\n      position: absolute;\n      width: 8px;\n      height: 8px;\n      background-color: #00F2FE;\n      border-radius: 50%;\n      box-shadow: 0 0 12px #00F2FE;\n    }\n\n    .node-1 {\n      top: 22%;\n      right: 22%;\n    }\n\n    .node-2 {\n      bottom: 28%;\n      left: 18%;\n    }\n\n    .node-3 {\n      top: 78%;\n      right: 38%;\n    }\n\n    /* Keyframe Animations */\n    @keyframes rotateCW {\n      from {\n        transform: rotate(0deg);\n      }\n\n      to {\n        transform: rotate(360deg);\n      }\n    }\n\n    @keyframes rotateCCW {\n      from {\n        transform: rotate(0deg);\n      }\n\n      to {\n        transform: rotate(-360deg);\n      }\n    }\n\n    @keyframes pulseScale {\n\n      0%,\n      100% {\n        transform: scale(1);\n      }\n\n      50% {\n        transform: scale(1.06);\n      }\n    }\n\n    @keyframes float {\n\n      0%,\n      100% {\n        transform: translateY(0px);\n      }\n\n      50% {\n        transform: translateY(-12px);\n      }\n    }\n\n  <\/style>\n<\/head>\n\n<body>\n  <div class='slide-canvas'>\n    <!-- Tech Brackets -->\n    <div class='corner-decor top-left'><\/div>\n    <div class='corner-decor top-right'><\/div>\n    <div class='corner-decor bottom-left'><\/div>\n    <div class='corner-decor bottom-right'><\/div>\n\n    <!-- Canvas Elements -->\n    <div class='grid-overlay'><\/div>\n    <div class='glow-orb'><\/div>\n\n    <!-- Branding -->\n    <div class='brand-container'>\n      <span class='brand-text'>CYBER<span class='bold'>SHIELD<\/span><\/span>\n      <span class='brand-sub'>ENTERPRISE SYSTEMS<\/span>\n    <\/div>\n\n    <!-- Main Title / Info Left -->\n    <div class='content-left'>\n      <div class='conference-tag'>\n        <span class='pulse-dot'><\/span>\n        KEYNOTE ADDRESS &bull; GLOBAL CYBER SUMMIT 2024\n      <\/div>\n      <h1 class='main-title'>\n   var i = 0;

  var counter = document.getElementById("counter");
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / 1920, h / 1080);
    frame.style.transform = "scale(" + s + ")";
    frame.style.left = ((w - 1920 * s) / 2) + "px";
    frame.style.top = ((h - 1080 * s) / 2) + "px";
  }
  window.addEventListener("resize", layout);
  layout();
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));

    counter.textContent = (i + 1) + " / " + slides.length;
  }
  document.getElementById("prev").onclick = function () { show(i - 1); };
  document.getElementById("next").onclick = function () { show(i + 1); };
  var fsBtn = document.getElementById("fs");

  function bindZone(el, dir) {
    var sx = 0, sy = 0;

      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(i + (dx < 0 ? 1 : -1));

  }

  window.addEventListener("keydown", function (e) {
